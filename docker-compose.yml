services:
  db:
    image: postgres:16
    restart: unless-stopped
    env_file:
      - .env.backend
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}"]
      interval: 2s
      timeout: 5s
      retries: 20

  migration:
    build:
      context: ./backend
      target: migration
    env_file:
      - .env.backend
    depends_on:
      db:
        condition: service_healthy

  server:
    build:
      context: ./backend
      target: dev
    env_file:
      - .env.backend
    volumes:
      - ./backend/src:/code/src
      - ./backend/test:/code/test
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthcheck/')"]
      interval: 2s
      timeout: 5s
      retries: 30
    depends_on:
      migration:
        condition: service_completed_successfully

  ui:
    build:
      context: ./frontend
    environment:
      API_URL: http://server:8000
      NEXT_PUBLIC_API_URL: http://localhost:8000
      WATCHPACK_POLLING: "true"
    volumes:
      - ./frontend:/code
      - /code/node_modules
    ports:
      - "3000:3000"
    depends_on:
      server:
        condition: service_healthy
